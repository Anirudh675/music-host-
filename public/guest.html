<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e12">
<title>Add songs to the queue</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0e0e12; color:#f2f2f5;
         display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { padding:14px 16px 8px; border-bottom:1px solid #232329; flex-shrink:0; }
  h1 { font-size:18px; margin:0 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #now { color:#9a9aa5; font-size:13px; min-height:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status { color:#9a9aa5; font-size:12px; min-height:16px; margin-bottom:8px; }
  .tabs { display:flex; gap:8px; }
  .tab { flex:1; padding:10px; text-align:center; border-radius:10px; background:#1a1a20; font-size:14px; user-select:none; cursor:pointer; }
  .tab.active { background:#3a5cff; }
  .search-row { padding:10px 16px; flex-shrink:0; }
  #search { width:100%; padding:11px 12px; border-radius:10px; border:1px solid #2a2a32; background:#17171c; color:#fff; font-size:16px; }
  #back { display:none; margin:0 16px 8px; padding:8px 12px; background:#1a1a20; border-radius:8px; font-size:13px; cursor:pointer; width:fit-content; flex-shrink:0; }
  #list { flex:1; overflow-y:auto; position:relative; -webkit-overflow-scrolling:touch; }
  .row { position:absolute; left:0; right:0; display:flex; align-items:center; gap:8px; padding:0 16px; border-bottom:1px solid #1c1c22; }
  .info { flex:1; min-width:0; }
  .t { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .s { font-size:12px; color:#9a9aa5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row button { flex-shrink:0; padding:7px 12px; border-radius:999px; border:0; background:#3a5cff; color:#fff; font-size:13px; font-weight:600; }
  .row button.alt { background:#2a2a32; }
  .row button.done { background:#2fae5c; }
  button:disabled { opacity:.45; }
  .row.pl { cursor:pointer; }
  .empty { text-align:center; padding:40px 16px; color:#9a9aa5; font-size:14px; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#2b3138; padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <h1 id="title">Add songs to the queue</h1>
  <div id="now"></div>
  <div id="status">Connecting…</div>
  <div class="tabs">
    <div class="tab active" data-view="playlists">Playlists</div>
    <div class="tab" data-view="songs">All songs</div>
  </div>
</header>
<div id="back">&larr; Back to playlists</div>
<div class="search-row"><input id="search" type="search" placeholder="Search…" autocomplete="off" enterkeyhint="search"></div>
<div id="list"><div class="empty">Loading…</div></div>
<div id="toast"></div>
<script>
(() => {
  'use strict';
  const ID = location.pathname.split('/').filter(Boolean).pop();
  const ROW = 56;
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const gKey = 'party.guest.' + ID;
  let guestId = store.get(gKey) || '';
  let name = store.get('party.name') || '';
  if (!name) { name = (prompt('Your name (shown to the driver)?') || '').trim().slice(0, 20); store.set('party.name', name); }

  const st = { lib: null, byId: new Map(), view: 'playlists', playlist: null, q: '', live: [], liveReq: '',
               ws: null, retry: 0, hostOnline: false, ended: false, remaining: null, added: new Set() };

  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
  function setStatus() {
    $('status').textContent = st.ended ? 'Session ended'
      : !st.ws || st.ws.readyState !== 1 ? 'Connecting…'
      : !st.hostOnline ? "The driver's phone is offline"
      : st.remaining === null ? '' : st.remaining + ' song' + (st.remaining === 1 ? '' : 's') + ' left for you';
  }
  const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const send = (o) => { if (st.ws && st.ws.readyState === 1) st.ws.send(JSON.stringify(o)); };

  async function loadLibrary() {
    try {
      const r = await fetch('/api/sessions/' + ID + '/library', { cache: 'no-store' });
      if (r.status === 204) { st.lib = null; render(); return; }
      if (!r.ok) return;
      st.lib = await r.json();
      st.byId = new Map(st.lib.songs.map((s) => [s.id, s]));
      render();
    } catch {}
  }

  function songs() {
    let list;
    if (!st.lib) list = st.live;
    else if (st.view === 'playlistDetail' && st.playlist) list = st.playlist.songIds.map((i) => st.byId.get(i)).filter(Boolean);
    else list = st.lib.songs;
    if (!st.lib || !st.q) return list;
    return list.filter((s) => (s.title + ' ' + s.artist + ' ' + s.album).toLowerCase().includes(st.q));
  }
  function playlists() {
    const p = st.lib ? st.lib.playlists : [];
    return st.q ? p.filter((x) => x.name.toLowerCase().includes(st.q)) : p;
  }

  function request(song, mode, btn) {
    if (st.ended || !st.hostOnline) return;
    send({ type: 'add', songId: song.id, mode });
    st.added.add(song.id);
    if (btn) { btn.textContent = 'Sent'; btn.classList.add('done'); }
  }

  function songRow(s) {
    const row = document.createElement('div'); row.className = 'row';
    const sent = st.added.has(s.id);
    row.innerHTML = '<div class="info"><div class="t">' + esc(s.title || 'Untitled') + '</div><div class="s">' +
      esc([s.artist, s.album].filter(Boolean).join(' — ')) + '</div></div>' +
      '<button class="alt">Next</button><button class="add' + (sent ? ' done' : '') + '">' + (sent ? 'Sent' : 'Add') + '</button>';
    const [next, add] = row.querySelectorAll('button');
    next.onclick = (e) => { e.stopPropagation(); request(s, 'next', next); };
    add.onclick = (e) => { e.stopPropagation(); request(s, 'queue', add); };
    return row;
  }
  function playlistRow(p) {
    const row = document.createElement('div'); row.className = 'row pl';
    row.innerHTML = '<div class="info"><div class="t">' + esc(p.name) + '</div><div class="s">' + p.songIds.length + ' songs</div></div>';
    row.onclick = () => { st.view = 'playlistDetail'; st.playlist = p; st.q = ''; $('search').value = ''; render(); };
    return row;
  }

  function mount(items, renderer, emptyText) {
    const box = $('list'); box.textContent = ''; box.onscroll = null;
    if (!items.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = emptyText; box.appendChild(d); return; }
    const spacer = document.createElement('div'); spacer.style.cssText = 'position:relative;height:' + items.length * ROW + 'px';
    const host = document.createElement('div'); spacer.appendChild(host); box.appendChild(spacer);
    const draw = () => {
      const top = box.scrollTop, h = box.clientHeight;
      const a = Math.max(0, Math.floor(top / ROW) - 6), b = Math.min(items.length, Math.ceil((top + h) / ROW) + 6);
      host.textContent = '';
      for (let i = a; i < b; i++) { const r = renderer(items[i]); r.style.top = i * ROW + 'px'; r.style.height = ROW + 'px'; host.appendChild(r); }
    };
    box.onscroll = draw; draw();
  }

  function render() {
    const detail = st.view === 'playlistDetail';
    $('back').style.display = detail ? 'block' : 'none';
    $('title').textContent = detail && st.playlist ? st.playlist.name : 'Add songs to the queue';
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.view === (detail ? 'playlists' : st.view)));
    $('search').placeholder = st.lib ? 'Search…' : 'Search the library…';
    if (!st.lib) {
      mount(st.live, songRow, st.q.length < 2 ? "Type at least 2 letters to search." : 'No songs found.');
    } else if (st.view === 'playlists') mount(playlists(), playlistRow, st.q ? 'No matches.' : 'No playlists.');
    else mount(songs(), songRow, st.q ? 'No matches.' : 'Nothing here yet.');
  }

  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { st.view = t.dataset.view; st.playlist = null; st.q = ''; $('search').value = ''; render(); });
  $('back').onclick = () => { st.view = 'playlists'; st.playlist = null; st.q = ''; $('search').value = ''; render(); };

  let timer;
  $('search').addEventListener('input', () => {
    clearTimeout(timer);
    const v = $('search').value.trim().toLowerCase();
    if (st.lib) { timer = setTimeout(() => { st.q = v; render(); }, 80); return; }
    st.q = v;
    if (v.length < 2) { st.live = []; render(); return; }
    // No library shared yet: ask the driver's phone to search for us.
    timer = setTimeout(() => { st.liveReq = String(Date.now()); send({ type: 'search', q: v, reqId: st.liveReq }); }, 450);
  });

  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    st.ws = ws;
    ws.onopen = () => { st.retry = 0; send({ type: 'guest', id: ID, guestId, name }); setStatus(); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'welcome') { guestId = m.guestId; store.set(gKey, guestId); st.remaining = m.remaining; st.hostOnline = m.hostOnline; now(m.nowPlaying); setStatus(); loadLibrary(); }
      else if (m.type === 'host') { st.hostOnline = m.online; setStatus(); if (m.online) loadLibrary(); }
      else if (m.type === 'state') now(m.nowPlaying);
      else if (m.type === 'library-updated') loadLibrary();
      else if (m.type === 'results') { if (m.reqId === st.liveReq) { st.live = m.songs; render(); } }
      else if (m.type === 'added') { st.remaining = m.remaining; setStatus(); toast(m.ok ? 'Added to the queue' : 'Could not add that song'); }
      else if (m.type === 'ended') { st.ended = true; setStatus(); toast('Session ended'); }
      else if (m.type === 'error') toast({ limit: "You've used all your songs", 'slow-down': 'Slow down a little', 'host-offline': "The driver's phone is offline", 'unknown-song': 'That song is not available' }[m.error] || 'Something went wrong');
    };
    ws.onclose = (ev) => {
      if (st.ended || ev.code === 4000 || ev.code === 4004) { st.ended = true; setStatus(); return; }
      setStatus(); st.retry = Math.min(st.retry + 1, 6); setTimeout(connect, 500 * 2 ** st.retry);
    };
  }
  function now(n) { $('now').textContent = n && n.title ? 'Now playing: ' + n.title + (n.artist ? ' — ' + n.artist : '') : ''; }

  connect(); setStatus();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141619">
<title>Add songs to the queue</title>
<style>
  :root { color-scheme: dark; --bg:#141619; --card:#1e2227; --text:#f2f4f6; --dim:#9aa3ad; --accent:#1cd667; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; background:var(--bg); padding:14px 16px 10px; z-index:2; border-bottom:1px solid #262b31; }
  h1 { font-size:18px; margin:0 0 2px; }
  #now { color:var(--dim); font-size:14px; min-height:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #status { font-size:13px; color:var(--dim); margin-top:2px; }
  #q { width:100%; margin-top:10px; padding:12px 14px; border-radius:12px; border:1px solid #333a42; background:var(--card); color:var(--text); font-size:16px; }
  main { padding:8px 12px 80px; }
  .row { display:flex; align-items:center; gap:10px; background:var(--card); border-radius:12px; padding:10px 12px; margin:8px 0; }
  .meta { flex:1; min-width:0; }
  .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .a { color:var(--dim); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button { border:0; border-radius:999px; padding:9px 14px; font-weight:600; font-size:14px; background:var(--accent); color:#04210f; }
  button.alt { background:#2b3138; color:var(--text); }
  button:disabled { opacity:.45; }
  .empty { color:var(--dim); text-align:center; margin-top:40px; }
  #toast { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#2b3138; padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; }
  #toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>Add songs to the queue</h1>
  <div id="now"></div>
  <div id="status">Connecting…</div>
  <input id="q" type="search" placeholder="Search for a song or artist" autocomplete="off" enterkeyhint="search">
</header>
<main id="list"><p class="empty">Type at least 2 letters to search.</p></main>
<div id="toast"></div>
<script>
(() => {
  'use strict';
  const sessionId = location.pathname.split('/').filter(Boolean).pop();
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const gKey = 'party.guest.' + sessionId;
  let guestId = store.get(gKey) || '';
  let name = store.get('party.name') || '';
  let ws, retry = 0, reqSeq = 0, lastReq = '', remaining = null, hostOnline = false, ended = false;
  let results = [];
  const pending = new Set();

  if (!name) {
    name = (prompt('Your name (shown to the driver)?') || '').trim().slice(0, 20);
    store.set('party.name', name);
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
  }
  function setStatus() {
    $('status').textContent = ended ? 'Session ended'
      : !ws || ws.readyState !== 1 ? 'Connecting…'
      : !hostOnline ? "The driver's phone is offline"
      : remaining === null ? '' : remaining + ' song' + (remaining === 1 ? '' : 's') + ' left for you';
  }
  function render() {
    const list = $('list'); list.textContent = '';
    if (!results.length) {
      const p = document.createElement('p'); p.className = 'empty';
      p.textContent = $('q').value.trim().length < 2 ? 'Type at least 2 letters to search.' : 'No songs found.';
      list.appendChild(p); return;
    }
    for (const s of results) {
      const row = document.createElement('div'); row.className = 'row';
      const meta = document.createElement('div'); meta.className = 'meta';
      const t = document.createElement('div'); t.className = 't'; t.textContent = s.title;
      const a = document.createElement('div'); a.className = 'a'; a.textContent = [s.artist, s.album].filter(Boolean).join(' · ');
      meta.append(t, a);
      const add = document.createElement('button'); add.textContent = 'Add';
      const next = document.createElement('button'); next.textContent = 'Next'; next.className = 'alt';
      for (const [btn, mode] of [[add, 'queue'], [next, 'next']]) {
        btn.disabled = ended || !hostOnline || remaining === 0;
        btn.onclick = () => { send({ type: 'add', songId: s.id, mode }); toast('Sending…'); };
      }
      row.append(meta, add, next); list.appendChild(row);
    }
  }
  function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws');
    ws.onopen = () => { retry = 0; send({ type: 'guest', id: sessionId, guestId, name }); setStatus(); };
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'welcome') {
        guestId = m.guestId; store.set(gKey, guestId);
        remaining = m.remaining; hostOnline = m.hostOnline; showNow(m.nowPlaying); setStatus(); render();
      } else if (m.type === 'host') { hostOnline = m.online; setStatus(); render(); }
      else if (m.type === 'state') showNow(m.nowPlaying);
      else if (m.type === 'results') { if (m.reqId === lastReq) { results = m.songs; render(); } }
      else if (m.type === 'added') {
        remaining = m.remaining; setStatus(); render();
        toast(m.ok ? 'Added to the queue' : 'Could not add that song');
      } else if (m.type === 'ended') { ended = true; setStatus(); render(); toast('Session ended'); }
      else if (m.type === 'error') {
        const msg = { limit: "You've used all your songs", 'slow-down': 'Slow down a little',
          'host-offline': "The driver's phone is offline", 'session-full': 'The queue is full',
          'unknown-song': 'Search again, then add' }[m.error] || 'Something went wrong';
        toast(msg);
      }
    };
    ws.onclose = (ev) => {
      if (ended || ev.code === 4000 || ev.code === 4004) { ended = true; setStatus(); render(); return; }
      setStatus(); retry = Math.min(retry + 1, 6);
      setTimeout(connect, 500 * 2 ** retry);
    };
  }
  function showNow(n) { $('now').textContent = n && n.title ? 'Now playing: ' + n.title + (n.artist ? ' — ' + n.artist : '') : ''; }

  let timer;
  $('q').addEventListener('input', () => {
    clearTimeout(timer);
    const q = $('q').value.trim();
    if (q.length < 2) { results = []; render(); return; }
    timer = setTimeout(() => { lastReq = String(++reqSeq); send({ type: 'search', q, reqId: lastReq }); }, 450);
  });
  connect(); setStatus();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Join the party</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0e0e12;
    color: #f2f2f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 16px 8px;
    border-bottom: 1px solid #232329;
    flex-shrink: 0;
  }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .tabs { display: flex; gap: 8px; }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 10px;
    background: #1a1a20;
    cursor: pointer;
    font-size: 14px;
    user-select: none;
  }
  .tab.active { background: #3a5cff; }
  .search-row { padding: 10px 16px; flex-shrink: 0; }
  #search {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #2a2a32;
    background: #17171c;
    color: #fff;
    font-size: 14px;
  }
  #banner {
    display: none;
    margin: 0 16px 8px;
    padding: 8px 12px;
    background: #3a5cff;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    flex-shrink: 0;
  }
  #list-container {
    flex: 1;
    overflow-y: auto;
    position: relative;
    -webkit-overflow-scrolling: touch;
  }
  .row {
    position: absolute;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid #1c1c22;
  }
  .row .info { flex: 1; min-width: 0; }
  .row .title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .subtitle { font-size: 12px; color: #9a9aa5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row button {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 999px;
    border: none;
    background: #2a2a32;
    color: #fff;
    font-size: 13px;
  }
  .row button.added { background: #2fae5c; }
  .row.playlist-row { cursor: pointer; }
  #back-btn {
    display: none;
    margin: 0 16px 8px;
    padding: 8px 12px;
    background: #1a1a20;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    width: fit-content;
  }
  #status { text-align: center; padding: 40px 16px; color: #9a9aa5; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <h1 id="party-title">Musly Party</h1>
    <div class="tabs">
      <div class="tab active" data-view="playlists">Playlists</div>
      <div class="tab" data-view="songs">All Songs</div>
    </div>
  </header>
  <div id="banner">Library updated — tap to refresh</div>
  <div id="back-btn">&larr; Back to playlists</div>
  <div class="search-row"><input id="search" placeholder="Search…" /></div>
  <div id="list-container"><div id="status">Loading…</div></div>

  <script>window.__PARTY_CODE__ = location.pathname.split('/').filter(Boolean).pop();</script>
  <script src="/join.js"></script>
</body>
</html>
